<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/ENW3.png">
    <title>Our Team | EnableWorks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #1d2641;
            --accent-blue: #007bff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: var(--text-color);
            line-height: 1.6;
        }

        .page-wrapper {
            width: 100%;
            margin: 0;
            background-color: #fff;
            overflow: hidden;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

      
        header {
            background-color: #1d2641;
            color: #fff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-decoration: none;
            cursor: pointer;
            background: linear-gradient(
                to right,
                #ffffff 20%,
                #007bff 40%,
                #4c55a1 60%,
                #ffffff 80%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineLogo 5s linear infinite;
        }

        @keyframes shineLogo {
            to { background-position: 200% center; }
        }

        header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 28px;
        }

        header nav a {
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            font-family: Arial, sans-serif;
            letter-spacing: 0.8px;
            position: relative;
            padding: 4px 0;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        header nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #007bff;
            transition: width 0.3s ease;
        }

        header nav a:hover { color: #007bff; }
        header nav a:hover::after { width: 100%; }

        header nav a.nav-apply {
            background-color: #007bff;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid #007bff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        header nav a.nav-apply::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            transition: all 0.6s ease;
        }

        header nav a.nav-apply::after { display: none; }

        header nav a.nav-apply:hover {
            background-color: #0056b3;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.35);
        }

        header nav a.nav-apply:hover::before { left: 150%; }

        
        .team-hero-banner {
            background-color: #6c88a8; 
            padding: 60px 40px;
            text-align: center;
            margin: 0;
        }

        .team-hero-banner h1 {
            margin: 0;
            font-size: 38px;
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: bold;
            color: #1d2641;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fadeUp 0.8s ease-out forwards;
        }

        
        .team-container-block {
            background-color: #f4f6f9;
            padding: 60px 40px 80px;
        }

        .team-section {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            box-sizing: border-box;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.25, 1, 0.5,1) forwards;
        }

        @keyframes fadeUp {
            from{
                opacity: 0;
                transform: translateY(40px);
            } 
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slider-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 420px;
            margin-bottom: 20px;
            perspective: 1000px;
        }

        .slides-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .team-card {
            position: absolute;
            width: 240px;
            height: 360px;
            border-radius: 20px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            pointer-events: none;
        }

        .team-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.5s ease;
        }

        .team-card.active {
            opacity: 1;
            z-index: 10;
            pointer-events: auto;
            transform: translateX(0) scale(1);
            box-shadow: 0 20px 40px rgba(29, 38, 65, 0.25);
        }
        .team-card.active img { filter: grayscale(0%); }

        .team-card.prev {
            opacity: 0.75;
            z-index: 5;
            transform: translateX(-180px) scale(0.8) rotateY(15deg);
        }
        .team-card.prev img { filter: grayscale(100%) blur(1px); }

        .team-card.next {
            opacity: 0.75;
            z-index: 5;
            transform: translateX(180px) scale(0.8) rotateY(-15deg);
        }
        .team-card.next img { filter: grayscale(100%) blur(1px); }

        .team-card.far {
            opacity: 0.3;
            z-index: 1;
            transform: translateX(0) scale(0.6);
        }
        .team-card.far img { filter: grayscale(100%) blur(3px); }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            background-color: #1d2641;
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            z-index: 20;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .nav-btn:hover {
            background-color: #007bff;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
        }

        .prev-btn { left: 40px; }
        .next-btn { right: 40px; }

        .member-info-panel {
            min-height: 120px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .member-name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }

        .line {
            height: 2px;
            background: linear-gradient(to right, rgba(0,123,255,0), #007bff, rgba(0,123,255,0));
            flex: 1;
        }

        .member-name {
            font-size: 26px;
            font-weight: 700;
            color: #1d2641;
            margin: 0;
        }

        .member-role {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6c88a8;
            margin: 8px 0 0 0;
            font-weight: 700;
        }

        .social-links-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 15px;
        }

        .social-icon {
            font-size: 18px;
            color: #1d2641;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .social-icon:hover {
            transform: translateY(-3px) scale(1.2);
        }

        .social-icon.fb:hover { color: #1877f2; }
        .social-icon.ig:hover { color: #e1306c; }
        .social-icon.tt:hover { color: #000000; }
        .social-icon.gh:hover { color: #24292e; }

        .dots-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cbd5e1;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #007bff;
            transform: scale(1.3);
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
        }

        .footer {
            text-align: center;
            padding: 20px 0;
            background-color: #1d2641;
            color: #ffffff;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .team-hero-banner h1 { font-size: 30px; }
            .team-card.prev { transform: translateX(-100px) scale(0.75); }
            .team-card.next { transform: translateX(100px) scale(0.75); }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            header { padding: 15px 20px; }
            header nav ul { gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        
      
        <header>
            <a href="index.html" class="logo">EnableWorks</a>
            <nav>
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="aboutPage.html">ABOUT</a></li>
                    <li><a href="featuresPage.html">FEATURES</a></li>
                    <li><a href="contactPage.html">CONTACT</a></li>
                    <li><a href="teamPage.HTML">DEVELOPER</a></li>
                    <li><a href="joblist.html" class="nav-apply">APPLY NOW</a></li>
                </ul>
            </nav>
        </header>

      
        <section class="team-hero-banner">
            <h1>Our Team</h1>
        </section>

    
        <div class="team-container-block">
            <section class="team-section">

                <div class="slider-container">
                    <button class="nav-btn prev-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
                    <button class="nav-btn next-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>

                    <div class="slides-wrapper" id="slidesWrapper">
                        
                        <div class="team-card" 
                             data-name="Aldrich Sala" 
                             data-role="Lead Developer"
                             data-fb="https://www.facebook.com/panpanqt15"
                             data-ig="https://www.instagram.com/aldrichxjustin/"
                             data-tt="https://www.tiktok.com/@aldrichxjustin"
                             data-gh="https://github.com/Aldrichxjustin">
                            <img src="Assets/asaa.jpg" alt="Aldrich Sala">
                        </div>

                        <div class="team-card" 
                             data-name="Sherwin Gundang" 
                             data-role="UI/UX Designer"
                             data-fb="https://www.facebook.com/sherwin.gundang"
                             data-ig="https://www.instagram.com/gervsss_3/"
                             data-tt="https://www.tiktok.com/@gervss_3?lang=en"
                             data-gh="https://github.com/sherwingundang">
                            <img src="Assets/sherwin.jpg" alt="Sherwin Gundang">
                        </div>

                        <div class="team-card" 
                             data-name="Ashley Beldua" 
                             data-role="Accessibility Expert"
                             data-fb="https://www.facebook.com/ashyyy.lll"
                             data-ig="https://www.instagram.com/ashyyy.lll/"
                             data-tt="https://www.tiktok.com/@ashyyy.lll19"
                             data-gh="https://github.com/ashyyylll">
                            <img src="Assets/sasa.webp" alt="Ashley Beldua">
                        </div>

                        <div class="team-card" 
                             data-name="Dashley Chan" 
                             data-role="Backend Specialist"
                             data-fb="https://www.facebook.com/dashley.chan.9"
                             data-ig="https://www.instagram.com/chandashley_/"
                             data-tt="https://www.tiktok.com/@chandashley"
                             data-gh="https://github.com/Dasheeshhh">
                            <img src="Assets/Character-splinter.webp" alt="Dashley Chan">
                        </div>
                    </div>
                </div>

                
                <div class="member-info-panel">
                    <div class="member-name-container">
                        <div class="line"></div>
                        <h3 class="member-name" id="memberName">Member Name</h3>
                        <div class="line"></div>
                    </div>
                    <p class="member-role" id="memberRole">Project Role</p>
                    
                    <div class="social-links-row">
                        <a href="#" id="fbLink" target="_blank" class="social-icon fb"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" id="igLink" target="_blank" class="social-icon ig"><i class="fab fa-instagram"></i></a>
                        <a href="#" id="ttLink" target="_blank" class="social-icon tt"><i class="fab fa-tiktok"></i></a>
                        <a href="#" id="ghLink" target="_blank" class="social-icon gh"><i class="fab fa-github"></i></a>
                    </div>
                </div>

                <div class="dots-row" id="dotsRow"></div>
            </section>
        </div>

        <footer class="footer">
            &copy; 2026 EnableWorks. All rights reserved.
        </footer>
    </div>

    <script>
        const cards = Array.from(document.querySelectorAll('.team-card'));
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsRow = document.getElementById('dotsRow');
        const nameDisplay = document.getElementById('memberName');
        const roleDisplay = document.getElementById('memberRole');
        
        const fbLink = document.getElementById('fbLink');
        const igLink = document.getElementById('igLink');
        const ttLink = document.getElementById('ttLink');
        const ghLink = document.getElementById('ghLink');
        
        let currentIndex = 0;
        const totalMembers = cards.length;

        cards.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if(index === 0) dot.classList.add('active');
            dot.addEventListener('click', () => jumpToSlide(index));
            dotsRow.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        function updateSliderStates() {
            cards.forEach((card, i) => {
                card.classList.remove('active', 'prev', 'next', 'far');

                if (i === currentIndex) {
                    card.classList.add('active');
                    
                    nameDisplay.textContent = card.getAttribute('data-name');
                    roleDisplay.textContent = card.getAttribute('data-role');
                    
                    fbLink.href = card.getAttribute('data-fb') || '#';
                    igLink.href = card.getAttribute('data-ig') || '#';
                    ttLink.href = card.getAttribute('data-tt') || '#';
                    ghLink.href = card.getAttribute('data-gh') || '#';
                } else if (i === (currentIndex - 1 + totalMembers) % totalMembers) {
                    card.classList.add('prev');
                } else if (i === (currentIndex + 1) % totalMembers) {
                    card.classList.add('next');
                } else {
                    card.classList.add('far');
                }
            });

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % totalMembers;
            updateSliderStates();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + totalMembers) % totalMembers;
            updateSliderStates();
        }

        function jumpToSlide(index) {
            currentIndex = index;
            updateSliderStates();
        }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        updateSliderStates();
    </script>
</body>
</html>
