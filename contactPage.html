 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/ENW3.png">
    <title>Contact Us | EnableWorks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #1d2641;
            --accent-blue: #007bff;
            --text-color: #333;
            --hero-blue: #6c88a8;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            color: var(--text-color);
            line-height: 1.6;
        }

        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background-color: #1d2641;
            color: #fff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
             background: linear-gradient(
                to right,
                #ffffff 20%,
                #007bff 40%,
                #4c55a1 60%,
                #ffffff 80%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineLogo 5s linear infinite;
        }

        @keyframes shineLogo {
            to{
                background-position: 200% center;
            }
        }

        header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 28px;
        }

        header nav a {
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            font-family: Arial, sans-serif;
            letter-spacing: 0.8px;
            position: relative;
            padding: 4px 0;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        header nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #007bff;
            transition: width 0.3s ease;
        }

        header nav a:hover {
            color: #007bff;
        }

        header nav a:hover::after {
            width: 100%;
        }
        
        header nav a.nav-apply {
            background-color: #007bff;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid #007bff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: inline-block;
            
        }

        header nav a.nav-apply::before{
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 100%

            );

            transform: skewX(-25deg);
            transition: all 0.6s ease;

        }

        header nav a.nav-apply::after {
            display: none;
        }

        header nav a.nav-apply:hover {
            background-color: #0056b3;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.35);
        }

        header nav a.nav-apply:hover::before {
            left: 150%;
        }

        .contact-banner {
            background-color: #6c88a8;
            padding: 60px 40px;
            text-align: center;
            color: #1d2641;
            margin: 0;
        }

        .contact-banner h1 {
            margin: 0 0 10px;
            font-size: 36px;
            font-weight: bold;
            font-family: 'Playfair Display', Georgia, serif;
            color: #1d2641;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contact-banner p {
            color: #ffffff;
            font-size: 16px;
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 0;
            text-transform: none;
            position: relative;
            top: -5px;
        }

        .contact-box-section {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .contact-form-card {
            background-color: #ffffff;
            border: 2px solid #eeeeee;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            margin-bottom: 35px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.2s forwards;
        }

        .contact-info-card {
            background-color: #ffffff;
            border: 2px solid #eeeeee;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            margin-bottom: 45px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out forwards;
        }

        .contact-form-card h2,
        .contact-info-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #1d2641;
            font-size: 28px;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid #cccccc;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            outline: none;
        }

        .contact-form textarea {
            min-height: 130px;
            resize: vertical;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #6c88a8;
        }

        .send-btn {
            align-self: center;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            padding: 12px 32px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }


        .send-btn::before{
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 100%

            );

            transform: skewX(-25deg);
            transition: all 0.6s ease;

        }

         .send-btn::after {
            display: none;
        }

        .send-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .send-btn:hover:hover::before {
            left: 150%;
        }

        .contact-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .contact-info-box {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 25px 15px;
            border: 1px solid #eeeeee;
        }

        .contact-info-box i {
            font-size: 28px;
            color: #6c88a8;
            margin-bottom: 12px;
        }

        .contact-info-box h3 {
            margin: 0 0 8px;
            color: #1d2641;
            font-size: 16px;
        }

        .contact-info-box p {
            margin: 0;
            color: #555;
            font-size: 14px;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            padding: 20px 0;
            background-color: #1d2641;
            color: #ffffff;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .contact-info-grid,
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            header {
                padding: 15px 18px;
            }

            header nav ul {
                gap: 12px;
            }

            header nav a {
                font-size: 12px;
            }

            .contact-banner {
                padding: 50px 20px;
            }

            .contact-banner h1 {
                font-size: 28px;
            }

            .contact-banner p {
                font-size: 14px;
            }

            .contact-box-section {
                padding: 50px 25px;
            }

            .contact-form-card,
            .contact-info-card {
                padding: 28px 20px;
            }

            .contact-form-card h2,
            .contact-info-card h2 {
                font-size: 24px;
            }

            .footer {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <header>
            <a href="index.html" class="logo">EnableWorks</a>

            <nav>
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="aboutPage.html">ABOUT</a></li>
                    <li><a href="featuresPage.html">FEATURES</a></li>
                    <li><a href="contactPage.html">CONTACT</a></li>
                    <li><a href="teamPage.HTML">Developer</a></li>
                    <li><a href="joblist.html" class="nav-apply">APPLY NOW</a></li>
                </ul>
            </nav>
        </header>

        <section class="contact-banner">
            <h1>Contact Us</h1>
            <p>Reach out to EnableWorks</p>
        </section>

        <main class="contact-box-section">
                
            <div class="contact-info-card">
                <h2>Contact Information</h2>

                <div class="contact-info-grid">
                    <div class="contact-info-box">
                        <i class="fa-solid fa-envelope"></i>
                        <h3>Email</h3>
                        <p>enableworks2@gmail.com</p>
                    </div>

                    <div class="contact-info-box">
                        <i class="fa-solid fa-phone"></i>
                        <h3>Phone</h3>
                        <p>+63 0992 802 4126</p>
                    </div>

                    <div class="contact-info-box">
                        <i class="fa-solid fa-location-dot"></i>
                        <h3>Location</h3>
                        <p>Quezon City, Philippines</p>
                    </div>
                </div>
            </div>

            <div class="contact-form-card">
                <h2> Message Us</h2>

                <form class="contact-form" action="https://formspree.io/f/mpqneyjq" method="POST">
                    <div class="form-row">
                        <input type="text" name="name" placeholder="Name (optional)">
                        <input type="email" name="email" placeholder="Email" required>
                    </div>

                    <textarea name="message" placeholder="Write your message here" required></textarea>

                    <button class="send-btn" type="submit">Send Message</button>
                </form>
            </div>

        </main>

        <footer class="footer">
            &copy; 2026 EnableWorks. All rights reserved.
        </footer>

    </div>

</body>
</html>
