<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnableWorks - Contact Us</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #1d2641;
            --accent-blue: #007bff;
            --text-color: #333;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            color: var(--text-color);
            line-height: 1.6;
        }

        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background-color: #1d2641;
            color: #fff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 28px;
        }

        header nav a {
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            font-family: Arial, sans-serif;
            letter-spacing: 0.8px;
            position: relative;
            padding: 4px 0;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        header nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #007bff;
            transition: width 0.3s ease;
        }

        header nav a:hover {
            color: #007bff;
        }

        header nav a:hover::after {
            width: 100%;
        }

        .contact-banner {
            background-color: #6c88a8; 
            padding: 60px 40px;
            text-align: center;
            color: #1d2641;
            margin: 0;
        }

        .contact-banner h1 {
            margin: 0 0 10px;
            font-size: 36px;
            font-weight: bold;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .banner-subtitle {
            margin: 0;
            font-size: 14px;
            font-style: italic;
            letter-spacing: 1px;
            text-transform: none;
        }

        .contact-space {
            flex: 1;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            padding: 20px 0;
            background-color: #1d2641;
            color: #ffffff;
            font-size: 14px;
        }

        @media (max-width: 560px) {
            header {
                padding: 15px 18px;
            }

            header nav ul {
                gap: 12px;
            }

            header nav a {
                font-size: 12px;
            }

            .contact-banner {
                padding: 50px 20px;
            }

            .contact-banner h1 {
                font-size: 30px;
            }

            .banner-subtitle {
                font-size: 12px;
            }

            .footer {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">
        
        <header>
            <div class="logo">EnableWorks</div>

            <nav>
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="aboutPage.html">ABOUT</a></li>
                    <li><a href="featuresPage.html">FEATURES</a></li>
                    <li><a href="contactPage.html">CONTACT</a></li>
                </ul>
            </nav>
        </header>

        <section class="contact-banner">
            <h1>Contact Us</h1>
            <p class="banner-subtitle">Reach out to EnableWorks</p>
        </section>

        <main class="contact-space">
        </main>

        <footer class="footer">
            &copy; 2026 EnableWorks. All rights reserved.
        </footer>

    </div>

</body>
</html>
